<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Example screenshot: glam makeup look</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2a1f2b"/>
      <stop offset="50%" stop-color="#3b2733"/>
      <stop offset="100%" stop-color="#1d1520"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f0c8a8"/>
      <stop offset="60%" stop-color="#e3b391"/>
      <stop offset="100%" stop-color="#c9946f"/>
    </linearGradient>
    <linearGradient id="lips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8203c"/>
      <stop offset="100%" stop-color="#920d20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f6e0bb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f6e0bb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4423"/>
      <stop offset="55%" stop-color="#b8783f"/>
      <stop offset="100%" stop-color="#e0a765"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg2)"/>
  <circle cx="150" cy="180" r="180" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="780" cy="980" r="220" fill="#ffffff" fill-opacity="0.04"/>

  <!-- hair -->
  <path d="M450 200 C 210 200 176 470 190 700 C 200 880 240 980 268 1040 L 330 1040 C 250 860 250 700 262 600 C 330 660 570 660 638 600 C 650 700 650 860 570 1040 L 632 1040 C 660 980 700 880 710 700 C 724 470 690 200 450 200 Z" fill="#1b1116"/>

  <!-- face -->
  <ellipse cx="450" cy="600" rx="260" ry="340" fill="url(#skin)"/>

  <!-- brows -->
  <path d="M268 452 q82 -40 168 -6" fill="none" stroke="#3a2419" stroke-width="16" stroke-linecap="round"/>
  <path d="M464 446 q86 -34 168 6" fill="none" stroke="#3a2419" stroke-width="16" stroke-linecap="round"/>

  <!-- left eye: bronze smokey eyeshadow (mock detection) -->
  <path d="M266 500 q84 -62 192 6 q-96 34 -192 -6 Z" fill="url(#shadow)" fill-opacity="0.92"/>
  <ellipse cx="352" cy="520" rx="66" ry="30" fill="#fdf6ef"/>
  <circle cx="352" cy="520" r="27" fill="#4a2f1e"/>
  <circle cx="352" cy="520" r="12" fill="#140c07"/>
  <circle cx="343" cy="511" r="6" fill="#ffffff" fill-opacity="0.85"/>
  <path d="M286 520 q66 -46 132 0" fill="none" stroke="#241611" stroke-width="9" stroke-linecap="round"/>

  <!-- right eye: liquid winged eyeliner (mock detection) -->
  <path d="M442 506 q86 -60 192 -6 q-96 40 -192 6 Z" fill="url(#shadow)" fill-opacity="0.72"/>
  <ellipse cx="548" cy="520" rx="66" ry="30" fill="#fdf6ef"/>
  <circle cx="548" cy="520" r="27" fill="#4a2f1e"/>
  <circle cx="548" cy="520" r="12" fill="#140c07"/>
  <circle cx="539" cy="511" r="6" fill="#ffffff" fill-opacity="0.85"/>
  <path d="M482 520 q66 -48 132 -2 l 44 -30" fill="none" stroke="#101014" stroke-width="11" stroke-linecap="round"/>
  <g stroke="#101014" stroke-width="5" stroke-linecap="round">
    <line x1="500" y1="494" x2="492" y2="478"/>
    <line x1="524" y1="484" x2="520" y2="466"/>
    <line x1="550" y1="482" x2="552" y2="464"/>
    <line x1="576" y1="488" x2="584" y2="470"/>
  </g>

  <!-- champagne highlighter on cheekbone (mock detection) -->
  <ellipse cx="322" cy="648" rx="86" ry="52" fill="url(#glow)"/>
  <ellipse cx="590" cy="648" rx="80" ry="48" fill="url(#glow)" fill-opacity="0.55"/>

  <!-- nose -->
  <path d="M450 560 L 434 686 q16 14 34 0" fill="none" stroke="#c08d68" stroke-width="8" stroke-linecap="round"/>

  <!-- lips: classic red matte (mock detection) -->
  <path d="M370 786 q40 -34 80 -12 q40 -22 80 12 q-42 44 -80 42 q-38 2 -80 -42 Z" fill="url(#lips)"/>
  <path d="M370 786 q80 22 160 0" fill="none" stroke="#6d0716" stroke-width="4"/>

  <!-- chunky gold hoop earring (mock detection) -->
  <circle cx="203" cy="654" r="46" fill="none" stroke="#dcb45c" stroke-width="17"/>
  <circle cx="203" cy="654" r="46" fill="none" stroke="#f2d68d" stroke-width="5"/>
  <circle cx="697" cy="654" r="46" fill="none" stroke="#c9a24d" stroke-width="17"/>
</svg>
