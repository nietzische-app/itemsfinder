<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Example screenshot: soft minimalist knitwear look</title>
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="55%" stop-color="#efe6da"/>
      <stop offset="100%" stop-color="#ded2c3"/>
    </linearGradient>
    <linearGradient id="knit" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f2e8da"/>
      <stop offset="55%" stop-color="#e3d5c0"/>
      <stop offset="100%" stop-color="#cbb99f"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d9cf"/>
      <stop offset="45%" stop-color="#e0a894"/>
      <stop offset="100%" stop-color="#c98570"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bgS)"/>
  <circle cx="726" cy="230" r="196" fill="#ffffff" fill-opacity="0.4"/>
  <ellipse cx="450" cy="1150" rx="270" ry="40" fill="#000000" fill-opacity="0.06"/>

  <!-- hair -->
  <path d="M450 96 C 344 96 322 176 328 250 L 336 372 L 372 372 L 364 246 C 404 268 496 268 536 246 L 528 372 L 564 372 L 572 250 C 578 176 556 96 450 96 Z" fill="#c9a06a"/>
  <!-- head -->
  <circle cx="450" cy="200" r="95" fill="#f0cdae"/>

  <!-- lips (mock detection: tinted lip balm) -->
  <path d="M418 228 q32 -13 64 0 q-32 27 -64 0 Z" fill="#c07f7a"/>
  <!-- eyes -->
  <path d="M394 178 q22 -16 44 0" fill="none" stroke="#5a4535" stroke-width="7" stroke-linecap="round"/>
  <path d="M462 178 q22 -16 44 0" fill="none" stroke="#5a4535" stroke-width="7" stroke-linecap="round"/>

  <!-- pearl drop earring (mock detection) -->
  <circle cx="355" cy="212" r="8" fill="#e9e2d6"/>
  <path d="M355 220 L 355 240" stroke="#d8cfbe" stroke-width="4"/>
  <circle cx="355" cy="256" r="18" fill="#f6f2ea"/>
  <circle cx="349" cy="250" r="6" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="545" cy="212" r="8" fill="#e9e2d6"/>
  <circle cx="545" cy="256" r="18" fill="#efe9df"/>

  <!-- neck -->
  <rect x="414" y="276" width="72" height="66" rx="20" fill="#e0bb9a"/>

  <!-- silk scarf (mock detection) -->
  <path d="M352 300 q98 96 196 0 l 22 44 q-120 108 -240 0 Z" fill="url(#silk)"/>
  <path d="M366 326 q84 76 168 0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6"/>
  <path d="M548 356 l 44 62 l -34 18 l -30 -58 Z" fill="#d29580"/>

  <!-- knit sweater (mock detection: chunky cable knit) -->
  <path d="M356 352 L 246 396 L 214 560 L 236 800 L 300 806 L 292 596 L 286 820 L 614 820 L 608 596 L 600 806 L 664 800 L 686 560 L 654 396 L 544 352 q-94 66 -188 0 Z" fill="url(#knit)"/>
  <g stroke="#c9b79c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M356 430 q22 40 0 80 q-22 40 0 80 q22 40 0 80 q-22 40 0 80"/>
    <path d="M414 430 q-22 40 0 80 q22 40 0 80 q-22 40 0 80 q22 40 0 80"/>
    <path d="M486 430 q22 40 0 80 q-22 40 0 80 q22 40 0 80 q-22 40 0 80"/>
    <path d="M544 430 q-22 40 0 80 q22 40 0 80 q-22 40 0 80 q22 40 0 80"/>
  </g>
  <path d="M214 560 q-14 118 22 240" fill="none" stroke="#bfab90" stroke-width="6"/>
  <path d="M686 560 q14 118 -22 240" fill="none" stroke="#bfab90" stroke-width="6"/>

  <!-- hands -->
  <rect x="236" y="784" width="66" height="56" rx="24" fill="#eac6a4"/>
  <rect x="598" y="784" width="66" height="56" rx="24" fill="#eac6a4"/>

  <!-- trousers hint -->
  <path d="M292 824 L 608 824 L 592 1120 L 480 1120 L 450 900 L 420 1120 L 308 1120 Z" fill="#e6ddd0"/>
</svg>
