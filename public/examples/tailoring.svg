<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Example screenshot: tailored evening look</title>
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8e4df"/>
      <stop offset="60%" stop-color="#d5d0ca"/>
      <stop offset="100%" stop-color="#bdb7b1"/>
    </linearGradient>
    <linearGradient id="wool" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#33384a"/>
      <stop offset="50%" stop-color="#212636"/>
      <stop offset="100%" stop-color="#13161f"/>
    </linearGradient>
    <linearGradient id="woolB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3040"/>
      <stop offset="100%" stop-color="#171b26"/>
    </linearGradient>
    <linearGradient id="leatherT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3b30"/>
      <stop offset="100%" stop-color="#261d17"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bgT)"/>
  <rect x="620" y="0" width="280" height="1200" fill="#ffffff" fill-opacity="0.16"/>
  <ellipse cx="450" cy="1160" rx="230" ry="34" fill="#000000" fill-opacity="0.1"/>

  <!-- hair + head -->
  <path d="M450 76 C 362 76 344 142 348 206 L 352 268 L 548 268 L 552 206 C 556 142 538 76 450 76 Z" fill="#1a1512"/>
  <circle cx="450" cy="172" r="78" fill="#e3b895"/>
  <path d="M420 172 q30 -12 60 0 q-30 24 -60 0 Z" fill="#9d5a4e"/>
  <rect x="420" y="238" width="60" height="54" rx="16" fill="#d5aa88"/>

  <!-- shirt collar -->
  <path d="M398 282 L 450 336 L 502 282 L 502 350 L 398 350 Z" fill="#f6f3ee"/>

  <!-- blazer (mock detection: tailored wool blazer) -->
  <path d="M400 278 L 306 306 L 254 430 L 250 632 L 322 640 L 330 486 L 336 640 L 442 640 L 442 300 Z" fill="url(#wool)"/>
  <path d="M500 278 L 594 306 L 646 430 L 650 632 L 578 640 L 570 486 L 564 640 L 458 640 L 458 300 Z" fill="url(#woolB)"/>
  <path d="M442 300 L 450 344 L 458 300 L 458 470 L 442 470 Z" fill="#0e1119"/>
  <circle cx="450" cy="492" r="9" fill="#8f9099"/>
  <circle cx="450" cy="548" r="9" fill="#8f9099"/>
  <path d="M310 320 L 276 434" stroke="#454c60" stroke-width="4" fill="none"/>
  <path d="M590 320 L 624 434" stroke="#454c60" stroke-width="4" fill="none"/>
  <rect x="268" y="596" width="52" height="46" rx="16" fill="#dfb694"/>
  <rect x="580" y="596" width="52" height="46" rx="16" fill="#dfb694"/>

  <!-- trousers (mock detection: pleated straight trousers) -->
  <path d="M326 642 L 574 642 L 580 760 L 566 1046 L 468 1046 L 452 812 L 434 1046 L 336 1046 L 322 760 Z" fill="url(#woolB)"/>
  <path d="M392 660 L 384 1040" stroke="#3d4356" stroke-width="4"/>
  <path d="M512 660 L 520 1040" stroke="#3d4356" stroke-width="4"/>

  <!-- boots (mock detection: leather chelsea boots) -->
  <path d="M336 1050 L 434 1050 L 442 1132 L 296 1132 L 300 1092 Z" fill="url(#leatherT)"/>
  <path d="M468 1050 L 566 1050 L 604 1092 L 608 1132 L 462 1132 Z" fill="url(#leatherT)"/>
  <rect x="292" y="1126" width="154" height="20" rx="8" fill="#14100d"/>
  <rect x="458" y="1126" width="154" height="20" rx="8" fill="#14100d"/>
  <path d="M352 1058 L 352 1120" stroke="#6b5646" stroke-width="7" stroke-linecap="round"/>
  <path d="M548 1058 L 548 1120" stroke="#6b5646" stroke-width="7" stroke-linecap="round"/>

  <!-- structured tote (mock detection) -->
  <rect x="622" y="562" width="138" height="168" rx="12" fill="#3a2c22"/>
  <path d="M652 562 q46 -70 92 0" fill="none" stroke="#3a2c22" stroke-width="12" stroke-linecap="round"/>
  <rect x="622" y="620" width="138" height="14" fill="#6b5646" fill-opacity="0.55"/>
  <circle cx="691" cy="680" r="12" fill="#c2a15c"/>
</svg>
