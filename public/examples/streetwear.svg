<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Example screenshot: streetwear outfit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f6efe8"/>
      <stop offset="55%" stop-color="#e9dfd6"/>
      <stop offset="100%" stop-color="#d9cfc6"/>
    </linearGradient>
    <linearGradient id="leather" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#33333c"/>
      <stop offset="45%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f83b6"/>
      <stop offset="60%" stop-color="#456a9c"/>
      <stop offset="100%" stop-color="#324e77"/>
    </linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f2ec"/>
      <stop offset="100%" stop-color="#cfc8bb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="700" cy="230" r="190" fill="#ffffff" fill-opacity="0.35"/>
  <ellipse cx="450" cy="1150" rx="250" ry="42" fill="#000000" fill-opacity="0.08"/>

  <!-- hair -->
  <path d="M450 78 C 356 78 336 150 340 214 L 342 300 L 372 300 L 366 208 C 400 226 500 226 534 208 L 528 300 L 558 300 L 560 214 C 564 150 544 78 450 78 Z" fill="#241c19"/>
  <!-- head -->
  <circle cx="450" cy="170" r="80" fill="#e8bf9f"/>
  <!-- lips (mock detection: nude matte lip liner) -->
  <path d="M417 168 q33 -14 66 0 q-33 26 -66 0 Z" fill="#b57a66"/>
  <!-- neck -->
  <rect x="418" y="238" width="64" height="58" rx="18" fill="#dcb191"/>

  <!-- necklace (mock detection: gold layered chain) -->
  <path d="M382 258 q68 62 136 0" fill="none" stroke="#d9b155" stroke-width="7" stroke-linecap="round"/>
  <path d="M390 274 q60 52 120 0" fill="none" stroke="#e6c574" stroke-width="6" stroke-linecap="round"/>

  <!-- crop top (mock detection: ribbed white crop top) -->
  <rect x="380" y="292" width="140" height="230" rx="26" fill="#f4f1ea"/>
  <g stroke="#ddd7cc" stroke-width="3">
    <line x1="404" y1="300" x2="404" y2="514"/>
    <line x1="428" y1="300" x2="428" y2="514"/>
    <line x1="452" y1="300" x2="452" y2="514"/>
    <line x1="476" y1="300" x2="476" y2="514"/>
    <line x1="500" y1="300" x2="500" y2="514"/>
  </g>

  <!-- jacket (mock detection: oversized black leather biker jacket) -->
  <path d="M366 284 L 300 306 L 254 420 L 250 620 L 316 640 L 322 500 L 330 660 L 400 664 L 400 300 Z" fill="url(#leather)"/>
  <path d="M534 284 L 600 306 L 646 420 L 650 620 L 584 640 L 578 500 L 570 660 L 500 664 L 500 300 Z" fill="url(#leather)"/>
  <path d="M400 300 L 452 340 L 500 300 L 500 452 L 452 470 L 400 452 Z" fill="#26262d"/>
  <path d="M452 342 L 452 466" stroke="#6f6f7d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="452" cy="480" r="10" fill="#8b8b99"/>
  <path d="M304 318 L 268 424" stroke="#4a4a56" stroke-width="4" fill="none"/>
  <path d="M596 318 L 632 424" stroke="#4a4a56" stroke-width="4" fill="none"/>

  <!-- jeans (mock detection: high-waisted straight-leg jeans) -->
  <path d="M336 640 L 564 640 L 570 760 L 556 1060 L 470 1060 L 452 800 L 434 1060 L 344 1060 L 330 760 Z" fill="url(#denim)"/>
  <path d="M336 700 L 564 700" stroke="#31527d" stroke-width="5"/>
  <path d="M452 700 L 452 800" stroke="#31527d" stroke-width="5"/>
  <rect x="352" y="722" width="66" height="70" rx="10" fill="none" stroke="#7ea1cf" stroke-width="4"/>
  <rect x="482" y="722" width="66" height="70" rx="10" fill="none" stroke="#7ea1cf" stroke-width="4"/>
  <path d="M344 1044 L 434 1044" stroke="#8fb0d8" stroke-width="6"/>
  <path d="M470 1044 L 556 1044" stroke="#8fb0d8" stroke-width="6"/>

  <!-- sneakers (mock detection: chunky platform sneakers) -->
  <path d="M300 1062 L 424 1062 L 430 1108 L 300 1108 Z" fill="#f2efe8"/>
  <path d="M476 1062 L 600 1062 L 600 1108 L 470 1108 Z" fill="#f2efe8"/>
  <rect x="286" y="1104" width="152" height="48" rx="22" fill="url(#sole)"/>
  <rect x="462" y="1104" width="152" height="48" rx="22" fill="url(#sole)"/>
  <g stroke="#b6ae9f" stroke-width="3">
    <line x1="290" y1="1126" x2="434" y2="1126"/>
    <line x1="466" y1="1126" x2="610" y2="1126"/>
  </g>
  <path d="M320 1070 L 400 1094" stroke="#c9c2b4" stroke-width="5"/>
  <path d="M500 1070 L 580 1094" stroke="#c9c2b4" stroke-width="5"/>

  <!-- arms -->
  <rect x="262" y="612" width="56" height="52" rx="22" fill="#e0b493"/>
  <rect x="582" y="612" width="56" height="52" rx="22" fill="#e0b493"/>
</svg>
